# 贪吃蛇贡献图动画：每天 00:00 UTC 自动生成，也可在 Actions 页手动触发
# （Run workflow）。生成结果推到 output 分支，README 里的 <picture> 引用它。
name: generate snake

on:
  schedule:
    - cron: "0 0 * * *" # 每天
  workflow_dispatch: # 允许手动跑

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 生成 SVG（明/暗两套配色）
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: linguo2625469
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 把 dist/ 推到 output 分支
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
